<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <style>
      .p-gold-main { fill: none; stroke: #C5A059; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .p-gold-sub { fill: none; stroke: #C5A059; stroke-width: 0.7; stroke-opacity: 0.65; }
      .p-emerald { fill: none; stroke: #10B981; stroke-width: 0.85; stroke-opacity: 0.75; }
      .p-fill-gold { fill: #C5A059; fill-opacity: 0.14; }
      .p-fill-emerald { fill: #10B981; fill-opacity: 0.10; }
      .p-dot { fill: #C5A059; }
    </style>
  </defs>

  <!-- Background Base Lattice Lines -->
  <g class="p-gold-sub">
    <line x1="0" y1="0" x2="160" y2="160" />
    <line x1="160" y1="0" x2="0" y2="160" />
    <line x1="80" y1="0" x2="80" y2="160" />
    <line x1="0" y1="80" x2="160" y2="80" />
    <!-- Diagonal sub-grid -->
    <line x1="0" y1="80" x2="80" y2="0" />
    <line x1="80" y1="0" x2="160" y2="80" />
    <line x1="160" y1="80" x2="80" y2="160" />
    <line x1="80" y1="160" x2="0" y2="80" />
  </g>

  <!-- Center Master 8-Point Star (Rub el Hizb) -->
  <g transform="translate(80, 80)">
    <!-- Shaded background polygons -->
    <rect class="p-fill-gold" x="-28" y="-28" width="56" height="56" rx="2" />
    <rect class="p-fill-gold" x="-28" y="-28" width="56" height="56" rx="2" transform="rotate(45)" />

    <!-- Outlines -->
    <rect class="p-gold-main" x="-28" y="-28" width="56" height="56" />
    <rect class="p-gold-main" x="-28" y="-28" width="56" height="56" transform="rotate(45)" />

    <!-- Inner 8-Petal Rosette -->
    <circle class="p-emerald" r="18" />
    <circle class="p-gold-sub" r="10" />
    <circle class="p-dot" r="2.5" />

    <!-- 8 Radiating Dots on Tips -->
    <circle class="p-dot" cx="0" cy="-39" r="1.5" />
    <circle class="p-dot" cx="27.5" cy="-27.5" r="1.5" />
    <circle class="p-dot" cx="39" cy="0" r="1.5" />
    <circle class="p-dot" cx="27.5" cy="27.5" r="1.5" />
    <circle class="p-dot" cx="0" cy="39" r="1.5" />
    <circle class="p-dot" cx="-27.5" cy="27.5" r="1.5" />
    <circle class="p-dot" cx="-39" cy="0" r="1.5" />
    <circle class="p-dot" cx="-27.5" cy="-27.5" r="1.5" />
  </g>

  <!-- 4 Corner Stars (Quarter stars matching seamless tiling at 0,0, 160,0, 0,160, 160,160) -->
  <g transform="translate(0, 0)">
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" />
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" transform="rotate(45)" />
    <circle class="p-emerald" r="14" />
    <circle class="p-dot" r="2.5" />
  </g>
  <g transform="translate(160, 0)">
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" />
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" transform="rotate(45)" />
    <circle class="p-emerald" r="14" />
    <circle class="p-dot" r="2.5" />
  </g>
  <g transform="translate(0, 160)">
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" />
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" transform="rotate(45)" />
    <circle class="p-emerald" r="14" />
    <circle class="p-dot" r="2.5" />
  </g>
  <g transform="translate(160, 160)">
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" />
    <rect class="p-gold-main" x="-24" y="-24" width="48" height="48" transform="rotate(45)" />
    <circle class="p-emerald" r="14" />
    <circle class="p-dot" r="2.5" />
  </g>

  <!-- 4 Edge Diamonds / Arabesque Petals (at midpoints 80,0 / 80,160 / 0,80 / 160,80) -->
  <g transform="translate(80, 0)">
    <polygon class="p-emerald" points="0,-16 11,-11 16,0 11,11 0,16 -11,11 -16,0 -11,-11" />
    <circle class="p-dot" r="1.5" />
  </g>
  <g transform="translate(80, 160)">
    <polygon class="p-emerald" points="0,-16 11,-11 16,0 11,11 0,16 -11,11 -16,0 -11,-11" />
    <circle class="p-dot" r="1.5" />
  </g>
  <g transform="translate(0, 80)">
    <polygon class="p-emerald" points="0,-16 11,-11 16,0 11,11 0,16 -11,11 -16,0 -11,-11" />
    <circle class="p-dot" r="1.5" />
  </g>
  <g transform="translate(160, 80)">
    <polygon class="p-emerald" points="0,-16 11,-11 16,0 11,11 0,16 -11,11 -16,0 -11,-11" />
    <circle class="p-dot" r="1.5" />
  </g>
</svg>
